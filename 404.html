<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, follow">
<meta name="description" content="Cette adresse n'existe pas ou a été déplacée. Retrouvez votre chemin sur le site Walden Corp.">
<meta name="theme-color" content="#EDF2FC">
<title>Page introuvable — Walden Corp</title>
<link rel="icon" href="favicon-blue.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#EDF2FC;--card:#FFFFFF;--ink:#0B1D42;--mut:#4A5A7C;--navy:#0F2A55;--sky:#4C7DFF;--sun:#FFC233;--line:#CBD6EE;--fd:'Bricolage Grotesque',Georgia,serif;--fb:'Figtree',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#06112A;--card:#0C1E44;--ink:#EAF0FF;--mut:#9DB0D8;--navy:#8FB0FF;--line:#1B3266}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#06112A;--card:#0C1E44;--ink:#EAF0FF;--mut:#9DB0D8;--navy:#8FB0FF;--line:#1B3266}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;margin:0}
html{min-height:100%;scroll-behavior:smooth}
body{min-height:100svh;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--fb);overflow-x:hidden;display:flex;flex-direction:column;transition:background-color .6s ease,color .6s ease}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:4px;border-radius:6px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(18px + env(safe-area-inset-top,0px)) max(5vw,env(safe-area-inset-left)) 18px}
.brand{display:flex;align-items:center;gap:10px;font:800 1.2rem var(--fd);text-decoration:none}
.brand img{width:34px;height:auto;display:block;transition:transform .3s ease}
.brand:hover img{transform:scale(1.1) rotate(-5deg)}
.dark-logo{display:none!important}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .light-logo{display:none!important}:root:not([data-theme="light"]) .dark-logo{display:block!important}}
:root[data-theme="dark"] .light-logo{display:none!important}:root[data-theme="dark"] .dark-logo{display:block!important}
:root[data-theme="light"] .light-logo{display:block!important}:root[data-theme="light"] .dark-logo{display:none!important}
.tg{flex:none;background:transparent;border:1.5px solid var(--line);color:var(--ink);border-radius:99px;width:42px;height:42px;cursor:pointer;font-size:1.1rem;transition:background-color .3s,border-color .3s}
main{position:relative;z-index:1;flex:1;display:flex;align-items:center;width:100%;max-width:1240px;margin:0 auto;padding:30px 5vw 70px}
.er{width:100%;padding:3vh 0}
.mk{width:100%;max-width:130px;margin:0 0 12px;transform:perspective(800px) rotateY(calc(var(--mx,0)*14deg)) rotateX(calc(var(--my,0)*-14deg));transition:transform .25s ease-out}
.mark{display:block;width:100%;overflow:visible;animation:bob 6s ease-in-out infinite}
.mark polygon{fill:var(--navy);animation:fly 1.4s cubic-bezier(.2,.9,.2,1) both}
.mark .s{fill:var(--navy);animation:fly 1.4s cubic-bezier(.2,.9,.2,1) both,glow 3.2s ease-in-out 1.6s infinite}
.mark polygon:nth-child(1){--x:-160px;--y:-90px}.mark polygon:nth-child(2){--x:-120px;--y:150px}.mark polygon:nth-child(3){--x:0;--y:-200px}.mark polygon:nth-child(4){--x:180px;--y:-100px}
@keyframes fly{from{transform:translate(var(--x),var(--y)) rotate(25deg);opacity:0}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes glow{50%{filter:drop-shadow(0 0 14px rgba(255,194,51,.75))}}
.n404{font:800 clamp(5.5rem,24vw,15rem)/.9 var(--fd);color:transparent;-webkit-text-stroke:2px var(--navy);letter-spacing:-.055em;margin:0 0 18px;animation:gl 4s infinite}
@keyframes gl{0%,92%,100%{transform:none}94%{transform:translate(-6px,2px) skewX(6deg)}96%{transform:translate(6px,-2px)}}
h1{font:800 clamp(2.1rem,8vw,5rem)/1.02 var(--fd);letter-spacing:-.02em;overflow-wrap:break-word;max-width:16ch}
p{max-width:62ch;color:var(--mut)}
.lead{font-size:clamp(1.05rem,2.5vw,1.2rem);margin:20px 0 30px;max-width:55ch}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:13px 25px;border-radius:99px;background:var(--sun);color:#0B1D42;font-weight:700;text-decoration:none;border:2px solid transparent;cursor:pointer;font-size:1rem;transition:transform .25s,box-shadow .25s,background-color .6s}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 0 -2px var(--navy)}
.btn.g{background:transparent;border-color:var(--ink);color:var(--ink)}
footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:20px 5vw calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--mut);font-size:.88rem}
footer a{color:inherit;text-decoration:none}footer a:hover{color:var(--ink)}
@media(min-width:1700px){html{font-size:112%}main{max-width:1500px}}
@media(max-width:560px){header{padding-top:calc(14px + env(safe-area-inset-top,0px))}.brand{font-size:1.05rem}.brand img{width:28px}main{padding-top:24px;padding-bottom:44px}.mk{max-width:100px}.n404{font-size:clamp(5rem,28vw,8rem)}.actions{flex-direction:column;align-items:stretch}.btn{text-align:center;width:100%}footer{flex-direction:column}}
@media(max-height:520px) and (orientation:landscape){main{padding-top:12px;padding-bottom:20px}.er{padding:0}.mk{max-width:70px}.n404{font-size:5rem;margin-bottom:8px}.lead{margin:12px 0 16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Navigation unifiée avec la page d'accueil */
header{position:fixed!important;top:0;left:0;right:0;z-index:50;min-height:76px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) max(5vw,env(safe-area-inset-left)) 14px!important}
header .brand{flex:0 0 auto}
header .brand img{width:34px;height:auto;display:block}
header .brand .dark-logo{display:none}
:root[data-theme="dark"] header .light-logo{display:none}
:root[data-theme="dark"] header .dark-logo{display:block}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) header .light-logo{display:none}:root:not([data-theme="light"]) header .dark-logo{display:block}}
header nav.site-nav{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
header nav.site-nav a{display:flex;align-items:center;min-height:42px;padding:8px 13px;border-radius:99px;text-decoration:none;font-weight:600;font-size:.92rem;color:var(--ink);white-space:nowrap;transition:background-color .2s,color .2s}
header nav.site-nav a:hover,header nav.site-nav a:focus-visible{background:var(--card)}
header .tg{flex:0 0 42px}
main{padding-top:calc(64px + 78px + env(safe-area-inset-top,0px))!important}
@media(max-width:940px){
  header nav.site-nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:60;display:flex;flex-wrap:nowrap;justify-content:flex-start;gap:2px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;background:var(--card);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(11,29,66,.06)}
  header nav.site-nav::-webkit-scrollbar{display:none}
  header nav.site-nav a{flex:0 0 auto;min-height:44px;padding:8px 11px;font-size:.82rem}
  main{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))!important}
  footer{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))!important}
}
@media(max-width:560px){header{gap:10px!important}.brand{font-size:1.02rem!important}header .brand img{width:28px}}
@media(prefers-reduced-motion:reduce){header nav.site-nav a{transition:none}}

</style>
<script>try{const savedTheme=localStorage.getItem('walden-theme');if(savedTheme==='light'||savedTheme==='dark')document.documentElement.dataset.theme=savedTheme}catch{}</script>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header>
<a class="brand" href="/" aria-label="Walden Corp, accueil">
<img src="Icon_Only_Blue-removebg.png" alt="" class="light-logo">
<img src="logo only bleu beige.png" alt="" class="dark-logo">
<span>Walden Corp</span>
</a>
<nav class="site-nav" aria-label="Navigation principale">
<a href="/">Accueil</a><a href="/solutions">Solutions</a><a href="/services">Services</a><a href="/methode">Méthode</a><a href="/vision">Vision</a><a href="/contact">Contact</a>
</nav>
<button class="tg" id="tg" type="button" aria-label="Changer de thème" title="Changer de thème">◐</button>
</header>
<main>
<section class="er" aria-labelledby="erh">
<div class="mk" aria-hidden="true"><svg class="mark" viewBox="180 360 900 560"><polygon points="199,406 361,406 467,575 383,717"/><polygon class="s" points="517,558 612,710 494,902 402,747"/><polygon points="627,373 851,742 757,895 540,517"/><polygon points="885,404 1056,404 868,715 848,690 780,572"/></svg></div>
<div class="n404" aria-hidden="true">404</div>
<h1 id="erh">Page introuvable</h1>
<p class="lead">Cette adresse n'existe pas ou a été déplacée. Rien de grave : repartons de l'accueil.</p>
<div class="actions">
<a class="btn" href="/">Retour à l'accueil</a>
<a class="btn g" href="mailto:contact@waldencorp.com">Nous contacter</a>
</div>
</section>
</main>
<footer><span>© 2026 Walden Corp. Tous droits réservés.</span><a href="/">Retour au site</a></footer>
<script>
const root=document.documentElement;
document.getElementById('tg').addEventListener('click',()=>{const dark=matchMedia('(prefers-color-scheme:dark)').matches;const current=root.dataset.theme||(dark?'dark':'light');const next=current==='dark'?'light':'dark';root.dataset.theme=next;try{localStorage.setItem('walden-theme',next)}catch{}});
(()=>{const c=document.getElementById('bg'),x=c.getContext('2d'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;let W,H,S,cols,rows,m={x:-999,y:-999};
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);S=W<600?44:W<1100?52:60;cols=Math.ceil(W/S)+1;rows=Math.ceil(H/S)+1;if(rm)draw(0)}
function draw(t){x.clearRect(0,0,W,H);const R=W<600?120:180,P=new Array(cols*rows);
for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){let px=i*S,py=j*S;const dx=px-m.x,dy=py-m.y,d=Math.hypot(dx,dy);let k=0;if(d<R){k=1-d/R;const f=k*k*28/(d||1);px+=dx*f;py+=dy*f}P[j*cols+i]={x:px,y:py,k,w:rm?0:Math.max(0,Math.sin((i+j)*.32-t*1.3)-.9)*8}}
x.lineWidth=1;x.strokeStyle='rgba(76,125,255,.16)';x.beginPath();const near=[];
for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const a=P[j*cols+i];for(const b of [i<cols-1&&P[j*cols+i+1],j<rows-1&&P[(j+1)*cols+i]]){if(!b)continue;if(a.k>0||b.k>0)near.push(a,b);else{x.moveTo(a.x,a.y);x.lineTo(b.x,b.y)}}}x.stroke();
for(let n=0;n<near.length;n+=2){const a=near[n],b=near[n+1],k=Math.max(a.k,b.k);x.strokeStyle='rgba(76,125,255,'+(.16+k*.7)+')';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}
for(const p of P){const g=p.k+p.w;if(g>.02){x.fillStyle=p.k>.35?'#FFC233':'rgba(76,125,255,.9)';const r=1.5+g*3;x.fillRect(p.x-r/2,p.y-r/2,r,r)}else{x.fillStyle='rgba(76,125,255,.35)';x.fillRect(p.x-1,p.y-1,2,2)}}}
function loop(t){draw(t/1000);requestAnimationFrame(loop)}size();addEventListener('resize',size);if(!rm)requestAnimationFrame(loop);
addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY;document.querySelectorAll('.mk').forEach(k=>{k.style.setProperty('--mx',(e.clientX/W-.5).toFixed(3));k.style.setProperty('--my',(e.clientY/H-.5).toFixed(3))})});document.addEventListener('pointerleave',()=>{m.x=m.y=-999});addEventListener('pointerup',e=>{if(e.pointerType==='touch')setTimeout(()=>{m.x=m.y=-999},600)});
})();
</script>
</body>
</html>
